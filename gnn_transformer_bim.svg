<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 24px; font-weight: 600; fill: #111827; }
    .node-text { font-size: 14px; font-weight: 600; fill: #111827; text-anchor: middle; }
    .sub-text { font-size: 12px; fill: #6b7280; text-anchor: middle; }
    .label-text { font-size: 12px; fill: #4b5563; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="60" class="title" text-anchor="middle">GNN+Transformer 融合架构 - BIM 模型审核</text>
  <rect x="30" y="100" width="900" height="420" rx="12" fill="none" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="50" y="130" font-size="14" font-weight="600" fill="#9ca3af">架构概览 (Architecture Overview)</text>
  <!-- Input -->
  <rect x="50" y="250" width="100" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="100" y="275" class="node-text">BIM 模型</text>
  <text x="100" y="295" class="sub-text">(IFC / RVT)</text>
  <!-- Graph Construction -->
  <rect x="210" y="250" width="140" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="280" y="275" class="node-text">图结构提取</text>
  <text x="280" y="295" class="sub-text">节点与空间边</text>
  <!-- GNN Layer -->
  <rect x="410" y="160" width="160" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="490" y="185" class="node-text">GNN 层</text>
  <text x="490" y="205" class="sub-text">局部拓扑与消息传递</text>
  <!-- Transformer Layer -->
  <rect x="410" y="340" width="160" height="60" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="490" y="365" class="node-text">Transformer 层</text>
  <text x="490" y="385" class="sub-text">全局注意力机制</text>
  <!-- Fusion Layer -->
  <rect x="630" y="250" width="140" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="700" y="275" class="node-text">特征融合</text>
  <text x="700" y="295" class="sub-text">Cross-Attention</text>
  <!-- Output Layer -->
  <rect x="820" y="250" width="100" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="870" y="275" class="node-text">审核结果</text>
  <text x="870" y="295" class="sub-text">合规/异常</text>
  <!-- Input to Construction -->
  <line x1="150" y1="280" x2="206" y2="280" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="158" y="268" width="40" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="178" y="280" class="label-text">解析</text>
  <!-- Construction to GNN -->
  <path d="M 350 265 C 380 265, 380 190, 406 190" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="360" y="215" width="40" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="380" y="227" class="label-text">图数据</text>
  <!-- Construction to Transformer -->
  <path d="M 350 295 C 380 295, 380 370, 406 370" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="360" y="325" width="40" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="380" y="337" class="label-text">序列化</text>
  <!-- GNN to Fusion -->
  <path d="M 570 190 C 600 190, 600 265, 626 265" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="575" y="215" width="44" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="597" y="227" class="label-text">局部特征</text>
  <!-- Transformer to Fusion -->
  <path d="M 570 370 C 600 370, 600 295, 626 295" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="575" y="325" width="44" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="597" y="337" class="label-text">全局特征</text>
  <!-- Fusion to Output -->
  <line x1="770" y1="280" x2="816" y2="280" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="778" y="268" width="32" height="16" fill="#ffffff" opacity="0.9"/>
  <text x="794" y="280" class="label-text">预测</text>
  <!-- Legend -->
  <g transform="translate(50, 540)">
    <rect x="0" y="0" width="400" height="30" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
    <line x1="15" y1="15" x2="35" y2="15" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="45" y="19" class="label-text" text-anchor="start">主流程</text>
    <line x1="105" y1="15" x2="125" y2="15" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="135" y="19" class="label-text" text-anchor="start">图数据流</text>
    <line x1="215" y1="15" x2="235" y2="15" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
    <text x="245" y="19" class="label-text" text-anchor="start">序列数据流</text>
    <line x1="325" y1="15" x2="345" y2="15" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="355" y="19" class="label-text" text-anchor="start">特征向量</text>
  </g>
</svg>